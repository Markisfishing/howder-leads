[project]
name = "howder-sales-api"
version = "0.1.0"
description = "厚達電子 潛在客戶推薦與邀請信系統 — 後端 API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.32",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "msal>=1.39.0",
    "cryptography>=43",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pgserver>=0.1.4",
    "httpx2>=2.16.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI 的 Depends() 寫在預設參數是官方用法

[tool.ruff.lint.per-file-ignores]
# migration 是手寫 SQL，套用後不能再改（CLAUDE.md 第 5 節），SQL 行長不檢查
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = false
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
