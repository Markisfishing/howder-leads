# 開發用：PostgreSQL 16 + Redis（Redis 在 M2 的 Worker 才會用到）
# 啟動：docker compose up -d
# Docker 不能用的話，改用 backend/scripts/dev_db.py 的內嵌 Postgres
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: howder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
